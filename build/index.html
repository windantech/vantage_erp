<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mailchimp-Like Email Builder</title>
  <link href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .builder-wrapper {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: #f9f9f9;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 18px;
      text-align: center;
      padding: 15px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    .editor-container {
      flex-grow: 1;
    }

    #editor {
      height: 100%;
    }

    .topbar {
      height: 50px;
      background: #00485c;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .topbar button {
      background: #00b894;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div><strong>Test Email Builder</strong></div>
    <div>
      <button onclick="editor.store()">Save</button>
      <button onclick="editor.run('preview')">Preview</button>
    </div>
  </div>

  <div class="builder-wrapper">
    <div class="sidebar">
      <h2>Blocks</h2>
      <!-- The actual block UI is injected by GrapesJS -->
    </div>

    <div class="editor-container">
      <div id="editor"></div>
    </div>
  </div>

  <script src="https://unpkg.com/grapesjs"></script>
  <script>
    const editor = grapesjs.init({
      container: '#editor',
      height: '100%',
      width: 'auto',
      fromElement: false,
      storageManager: {
        type: 'remote',
        stepsBeforeSave: 1,
        urlStore: 'save.php',
        contentTypeJson: true
      },
      panels: { defaults: [] },
      blockManager: {
        appendTo: '.sidebar',
      },
      plugins: ['gjs-preset-newsletter'],
      pluginsOpts: {
        'gjs-preset-newsletter': {}
      }
    });

    const blockManager = editor.BlockManager;

    // Custom Blocks
    blockManager.add('whatsapp-block', {
      label: 'WhatsApp',
      category: 'Custom',
      content: '<div style="text-align:center;padding:20px;"><a href="https://wa.me/254700000000" style="color:white;background:#25D366;padding:10px 20px;border-radius:5px;text-decoration:none;display:inline-block;">Chat on WhatsApp</a></div>'
    });

    blockManager.add('youtube-preview', {
      label: 'YouTube Video',
      category: 'Custom',
      content: '<div style="text-align:center;padding:20px;"><img src="https://img.youtube.com/vi/VIDEO_ID/hqdefault.jpg" style="max-width:100%;"><p style="font-size:14px;color:#555;">Watch on YouTube</p></div>'
    });

    blockManager.add('logo-block', {
      label: 'Logo',
      category: 'Custom',
      content: '<div style="text-align:center;padding:20px;"><img src="https://via.placeholder.com/150x50?text=Logo" style="max-width:100%;"></div>'
    });

    blockManager.add('product-card', {
      label: 'Product Card',
      category: 'Custom',
      content: '<div style="padding: 20px; text-align: center; border: 1px solid #ddd;">
                  <img src="https://via.placeholder.com/150" style="width:100%; max-width:150px; margin-bottom:10px;">
                  <h4 style="margin:10px 0;">Product Title</h4>
                  <p style="font-size:14px; color:#555;">Short product description goes here.</p>
                  <a href="#" style="background:#007bff; color:white; padding:10px 20px; display:inline-block; text-decoration:none; border-radius:5px;">Buy Now</a>
                </div>'
    });

    blockManager.add('button-block', {
      label: 'CTA Button',
      category: 'Custom',
      content: '<div style="text-align:center;padding:20px;"><a href="#" style="color:white;background:#28a745;padding:10px 20px;border-radius:5px;text-decoration:none;display:inline-block;">Click Me</a></div>'
    });

    blockManager.add('image-block', {
      label: 'Image',
      category: 'Custom',
      content: '<div style="text-align:center;padding:20px;"><img src="https://via.placeholder.com/600x200" style="width:100%;max-width:600px;"></div>'
    });

    blockManager.add('text-block', {
      label: 'Text Block',
      category: 'Custom',
      content: '<div style="padding:20px;font-size:16px;color:#333;">Start typing your content here...</div>'
    });
  </script>
</body>
</html>
